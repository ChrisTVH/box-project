# Manual AppImage distribution build for box-rpg-maker.
#
# Trigger: manual only (when: manual on the appimage job). Never on push.
# The Python-pure builder (python3 -m tools.build_appimage) computes the
# stable year.month.commit-count tag, creates it at HEAD, verifies the
# checkout is exactly at that tag, stages the frontend-only AppDir, and
# converts it with a recent FUSE3-capable appimagetool (no libfuse2).
# The builder never refuses root, so the default root user of the
# python:3.14 image is fine (unlike install.py, building needs no user
# install and writes only inside the job workspace).
stages:
  - package

appimage:
  stage: package
  image: python:3.14
  rules:
    - when: manual
  before_script:
    - apt-get update && apt-get install -y git ca-certificates fuse3
  script:
    - python3 -m tools.build_appimage --yes --output dist/box-rpg-maker.appimage
  artifacts:
    paths:
      - dist/box-rpg-maker.appimage
    expire_in: 4 weeks
